module: easymocap.multistage.base.MultiStage
args:
    optimizer:
        optim_type: lbfgs
        tolerance_grad: 1e-07
        tolerance_change: 1e-07
        max_iter: 20
        lr: 0.001
        betas: [0.9, 0.999]
        weight_decay: 0.0
    monitor:
        ftol: 1e-07
        gtol: 1e-07
        maxiters: 100000
        vis2d: False
        vis3d: False
        timer: True
        verbose: False
        printloss: False
        check: False
    batch_size: 1
    initialize:
        init_spin:
            module: easymocap.multistage.init_cnn.InitSpin
            args:
                mean_params: data/models/smpl_mean_params.npz
                ckpt_path: data/models/spin_checkpoint.pt
                share_shape: True
        init_pose:
            module: easymocap.multistage.init_pose.SmoothPoses
            args:
                window_size: 2
    stages:
        camera:
            optimize: ['Th', 'Rh']
            repeat: 1
            before_after: {}
            loss:
                k2d:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.Keypoints2D
                    infos: ['keypoints2d', 'K', 'Rc', 'Tc']
                    args:
                        index_est: [2, 5, 9, 12]
                        index_gt: [2, 5, 9, 12]
                        norm: l2
                        unproj: True
                smoothTh:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: Th
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothDepth:
                    weight: 1000.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: Th
                        index: [2]
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothRh:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.SmoothRot
                    args:
                        key: Rh
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
        joints:
            optimize: ['poses', 'Th', 'Rh']
            repeat: 2
            loss:
                k2d:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.Keypoints2D
                    infos: ['keypoints2d', 'K', 'Rc', 'Tc']
                    args:
                        norm: gm
                        norm_info: 0.02
                        unproj: True
                init:
                    weight: 1.0
                    module: easymocap.multistage.lossbase.AnyReg
                    infos: ['init_poses']
                    args:
                        key: poses
                        norm: l2
                pf-smoothtorso:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: poses_full
                        index: [0, 1, 2, 9, 10, 11, 12, 13, 14, 18, 19, 20, 39, 40, 41, 42, 43, 44]
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothposes:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: poses
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothTh:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: Th
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothDepth:
                    weight: 1000.0
                    module: easymocap.multistage.lossbase.AnySmooth
                    args:
                        key: Th
                        index: [2]
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
                smoothRh:
                    weight: 100.0
                    module: easymocap.multistage.lossbase.SmoothRot
                    args:
                        key: Rh
                        weight: [0.5, 0.3, 0.1, 0.1]
                        norm: l2
                        order: 2
